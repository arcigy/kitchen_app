worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 256m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream arcigy_worker {
    server 127.0.0.1:5191;
    keepalive 16;
  }

  server {
    listen 80;
    root /app/dist;

    location ~ ^/(?:api|storage)(?:/|$) {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_pass http://arcigy_worker;
    }

    location ~ ^/(?:health|ready|metrics)$ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://arcigy_worker;
    }

    location ^~ /assets/ {
      try_files $uri @static_not_found;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    location ~* \.[a-z0-9]+$ {
      try_files $uri @static_not_found;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    location @static_not_found {
      default_type text/plain;
      return 404 "Static asset not found.\n";
      add_header Cache-Control "no-store" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }
  }
}
