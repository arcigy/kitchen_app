worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  # Avoid kernel sendfile truncation across the nested CapRover proxy/container
  # boundary. Buffered reads are marginally more expensive, but reliable for the
  # multi-megabyte editor and PDF worker bundles.
  sendfile off;
  tcp_nopush off;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 256m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript application/json application/manifest+json application/wasm image/svg+xml text/css text/plain;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # CapRover terminates TLS before this container. Preserve its forwarded
  # origin instead of replacing https with the container's internal http hop.
  map $http_x_forwarded_proto $arcigy_forwarded_proto {
    '' $scheme;
    default $http_x_forwarded_proto;
  }

  map $http_x_forwarded_host $arcigy_forwarded_host {
    '' $host;
    default $http_x_forwarded_host;
  }

  upstream arcigy_worker {
    server 127.0.0.1:5191;
    keepalive 16;
  }

  server {
    listen 80;
    root /app/dist;

    location ~ ^/(?:api|storage)(?:/|$) {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $arcigy_forwarded_proto;
      proxy_set_header X-Forwarded-Host $arcigy_forwarded_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_pass http://arcigy_worker;
    }

    location ~ ^/(?:health|ready|metrics)$ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $arcigy_forwarded_proto;
      proxy_set_header X-Forwarded-Host $arcigy_forwarded_host;
      proxy_pass http://arcigy_worker;
    }

    # Compatibility for profiles cached before the default avatar asset was
    # corrected. The internal rewrite keeps the final SVG MIME type intact.
    location = /organization/default-user.png {
      rewrite ^ /organization/default-user.svg last;
    }

    location ^~ /assets/ {
      try_files $uri @static_not_found;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    # Generated module previews are content-versioned (for example /v4/), so
    # they are safe to retain in the browser instead of downloading on every
    # properties-panel refresh.
    location ~ ^/module-icons/furniture/v[0-9]+/ {
      try_files $uri @static_not_found;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    location ~* \.[a-z0-9]+$ {
      try_files $uri @static_not_found;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }

    location @static_not_found {
      default_type text/plain;
      return 404 "Static asset not found.\n";
      add_header Cache-Control "no-store" always;
      include /etc/nginx/arcigy-security-headers.conf;
    }
  }
}
