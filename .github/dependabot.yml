version: 2

# Monthly, and without automatic rebases: every rebase re-ran the full 20-minute CI.
# Rebase a Dependabot PR on demand with "@dependabot rebase" when it is about to be merged.

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-production-minor-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
