name: Deploy to CapRover

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Read redacted runtime diagnostics without deploying
        required: true
        default: false
        type: boolean
      rotate_master_password:
        description: Synchronize the CapRover master password from a staged secret
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  rotate-caprover-master-password:
    if: github.event_name == 'workflow_dispatch' && inputs.rotate_master_password
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: develop
    steps:
      - name: Synchronize CapRover master password
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_PASSWORD_NEXT: ${{ secrets.CAPROVER_PASSWORD_NEXT }}
        run: |
          set -euo pipefail
          if [ -z "$CAPROVER_PASSWORD_NEXT" ]; then
            echo "CAPROVER_PASSWORD_NEXT is required."
            exit 1
          fi
          payload="$(node -e 'process.stdout.write(JSON.stringify({oldPassword: process.env.CAPROVER_PASSWORD, newPassword: process.env.CAPROVER_PASSWORD_NEXT}))')"
          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t /user/changepassword/ \
            -m POST \
            -d "$payload" \
            -o caprover-password-rotation.json
          node -e 'const r=require("./caprover-password-rotation.json"); const summary={status:r?.status ?? null, description:String(r?.description ?? r?.message ?? "").replace(/[A-Za-z0-9_-]{24,}/g,"[REDACTED]").slice(0,300)}; console.log(JSON.stringify(summary)); if (!r || r.status !== 100) process.exit(1); console.log("CapRover master password synchronized.")'
          rm -f caprover-password-rotation.json

  diagnose-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: develop
    steps:
      - name: Read redacted runtime startup diagnostics
        env:
          APP_NAME: ${{ vars.CAPROVER_APP || 'arcigy-kitchen-develop' }}
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f caprover-runtime-logs.json caprover-build-status.json caprover-nodes.json' EXIT

          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t "/user/apps/appData/${APP_NAME}/logs?encoding=utf-8" \
            -m GET \
            -d '{}' \
            -o caprover-runtime-logs.json

          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t "/user/apps/appData/${APP_NAME}/" \
            -m GET \
            -d '{}' \
            -o caprover-build-status.json

          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t "/user/system/nodes/" \
            -m GET \
            -d '{}' \
            -o caprover-nodes.json

          node <<'NODE'
          const payload = JSON.parse(require('node:fs').readFileSync('caprover-runtime-logs.json', 'utf8'));
          const logs = String(payload?.data?.logs ?? '');
          const redact = (line) => line
            .replace(/(?:postgres(?:ql)?:\/\/)[^\s"']+/gi, '[REDACTED_DATABASE_URL]')
            .replace(/\b(password|token|secret|api[_-]?key)\s*[:=]\s*[^\s,;]+/gi, '$1=[REDACTED]')
            .replace(/Bearer\s+[A-Za-z0-9._~-]+/gi, 'Bearer [REDACTED]')
            .replace(/[A-Za-z0-9_-]{24,}/g, '[REDACTED_LONG_VALUE]');
          const tail = logs
            .split(/\r?\n/)
            .slice(-160)
            .map(redact);
          console.log(`CapRover returned ${logs.length} runtime-log characters.`);
          console.log(tail.length ? tail.join('\n') : 'CapRover returned no runtime-log lines.');
          const build = JSON.parse(require('node:fs').readFileSync('caprover-build-status.json', 'utf8'))?.data ?? {};
          const nodes = JSON.parse(require('node:fs').readFileSync('caprover-nodes.json', 'utf8'))?.data?.nodes ?? [];
          console.log(JSON.stringify({
            build: {
              isAppBuilding: !!build.isAppBuilding,
              isBuildFailed: !!build.isBuildFailed,
              logTail: String(build.logs ?? '').split(/\r?\n/).slice(-30).map(redact),
            },
            nodes: nodes.map((node) => ({
              hostname: node.hostname,
              type: node.type,
              state: node.state,
              availability: node.status,
              architecture: node.architecture,
              memoryBytes: node.memoryBytes,
            })),
          }));
          NODE

  deploy:
    if: github.event_name != 'workflow_dispatch' || (!inputs.diagnostics_only && !inputs.rotate_master_password)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: develop
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # A duplicate deploy gate must never hold the protected develop
        # deployment indefinitely. The same full suite runs in CI with a
        # 30-minute job limit; this shorter, explicit step bound leaves time
        # for a clear failure and preserves the CapRover deploy timeout.
        timeout-minutes: 15
        run: npm test

      - name: Production dependency policy
        run: npm run security:dependencies

      - name: Build
        run: npm run build

      - name: Create deploy archive
        run: |
          npx --no-install tsx scripts/listDeployMaterialAssets.ts > material-asset-files.txt

          tar \
            --exclude-vcs \
            --exclude=.env \
            --exclude=./node_modules \
            --exclude=./dist \
            --exclude=./reports \
            --exclude=./outputs \
            --exclude=./storage \
            --exclude='*.log' \
            --exclude=kitchenapp.tar \
            --exclude=material-asset-files.txt \
            --exclude=./assets/materials \
            --exclude=./backend/materials/assets \
            --exclude=./HDRI \
            --exclude=./Materials \
            --exclude=./blender/previews \
            --exclude=./public/hdri \
            --exclude=./public/materials \
            -cf kitchenapp.tar .

          tar -rf kitchenapp.tar -T material-asset-files.txt
          ls -lh kitchenapp.tar

      - name: Validate isolated and durable CapRover target
        run: |
          set -euo pipefail
          trap 'rm -f caprover-apps.json' EXIT
          if [ -z "${CAPROVER_APP_URL:-}" ]; then
            echo "CAPROVER_APP_URL is required for post-deploy health and readiness verification."
            exit 1
          fi
          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t /user/apps/appDefinitions \
            -m GET \
            -d '{}' \
            -o caprover-apps.json
          chmod 600 caprover-apps.json
          npx --no-install tsx scripts/validateCapRoverDeployPreflight.ts caprover-apps.json
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP: ${{ vars.CAPROVER_APP || 'arcigy-kitchen-develop' }}
          CAPROVER_APP_URL: ${{ vars.CAPROVER_APP_URL }}
          ARCIGY_DEPLOY_APP_ENV: dev
          ARCIGY_DEPLOY_DATABASE_SCHEMA: dev
          ARCIGY_DEPLOY_OBJECT_PREFIX: dev
          ARCIGY_DEPLOY_STORAGE_PATH: /app/storage

      - name: Inspect CapRover image capacity (read-only)
        run: |
          set -euo pipefail
          trap 'rm -f caprover-unused-images.json' EXIT
          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t /user/apps/appDefinitions/unusedImages \
            -m GET \
            -d '{"mostRecentLimit":2}' \
            -o caprover-unused-images.json
          chmod 600 caprover-unused-images.json
          npx --no-install tsx scripts/caproverUnusedImageCleanup.ts inspect caprover-unused-images.json
          echo "Automatic image deletion is disabled. Any cleanup requires a fresh reviewed inventory and explicit operational approval."
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}

      - name: Deploy
        id: deploy_caprover
        continue-on-error: true
        run: |
          set -o pipefail
          npx caprover@2.3.1 deploy -h "$CAPROVER_SERVER" -p "$CAPROVER_PASSWORD" -a "$CAPROVER_APP" -t kitchenapp.tar 2>&1 | tee deploy.log
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP: ${{ vars.CAPROVER_APP || 'arcigy-kitchen-develop' }}

      - name: Verify deployed health and readiness
        id: readiness
        if: steps.deploy_caprover.outcome == 'success'
        run: |
          base_url="${CAPROVER_APP_URL%/}"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "$base_url/health" >/dev/null && \
               curl --fail --silent --show-error --max-time 10 "$base_url/ready" >/dev/null; then
              echo "Deployment is healthy and ready."
              exit 0
            fi
            sleep 5
          done
          echo "Deployment did not become healthy and ready in time."
          exit 1
        env:
          CAPROVER_APP_URL: ${{ vars.CAPROVER_APP_URL }}

      - name: Notify deploy result
        if: always() && env.NTFY_TOPIC != ''
        run: |
          python - <<'PY' > payload.json
          import json, os
          payload = {
            "app": os.environ["APP_NAME"],
            "status": os.environ["DEPLOY_STATUS"],
            "commit": os.environ["GITHUB_SHA"],
            "branch": os.environ["GITHUB_REF_NAME"],
            "repo": os.environ["GITHUB_REPOSITORY"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          print(json.dumps(payload))
          PY
          curl -fsS -X POST --data-binary @payload.json "https://ntfy.sh/$NTFY_TOPIC" || true
        env:
          APP_NAME: ${{ vars.CAPROVER_APP || 'arcigy-kitchen-develop' }}
          DEPLOY_STATUS: ${{ steps.deploy_caprover.outcome == 'success' && steps.readiness.outcome == 'success' && 'success' || 'failure' }}

      - name: Fail if deploy or readiness failed
        if: steps.deploy_caprover.outcome != 'success' || steps.readiness.outcome != 'success'
        run: exit 1
