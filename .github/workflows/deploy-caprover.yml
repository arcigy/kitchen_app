name: Deploy to CapRover

# Deploys only after the CI workflow has succeeded for the exact pushed commit.
# workflow_run always runs this file from the default branch (main) and never
# waits on a runner while CI is still verifying; the deployed code is checked
# out from the CI run's head SHA. main deploys to production, develop to the
# isolated develop app.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'develop' }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Require successful CI verify for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            main|develop) ;;
            *)
              echo "Only main and develop are deployed; got ${DEPLOY_BRANCH}."
              exit 1
              ;;
          esac
          # workflow_run already implies a successful CI run. This single check
          # also guards manual dispatches, without polling or waiting.
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/check-runs?per_page=100")"
          verify="$(jq -r --arg sha "$DEPLOY_SHA" '[.check_runs[] | select(.name == "verify" and .head_sha == $sha)] | last // empty | [.status, (.conclusion // "")] | @tsv' <<< "$checks")"
          if [[ "$verify" != $'completed\tsuccess' ]]; then
            echo "CI verify has not succeeded for ${DEPLOY_SHA}: ${verify:-missing}"
            exit 1
          fi
          echo "CI verify succeeded for ${DEPLOY_SHA} on ${DEPLOY_BRANCH}."

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Select CapRover app
        id: caprover_app
        run: |
          if [ "$DEPLOY_BRANCH" = "main" ]; then
            echo "app=$CAPROVER_PRODUCTION_APP" >> "$GITHUB_OUTPUT"
            echo "url=$CAPROVER_PRODUCTION_APP_URL" >> "$GITHUB_OUTPUT"
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
            echo "database_schema=prod" >> "$GITHUB_OUTPUT"
            echo "object_prefix=prod" >> "$GITHUB_OUTPUT"
          else
            echo "app=$CAPROVER_DEVELOP_APP" >> "$GITHUB_OUTPUT"
            echo "url=$CAPROVER_DEVELOP_APP_URL" >> "$GITHUB_OUTPUT"
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
            echo "database_schema=dev" >> "$GITHUB_OUTPUT"
            echo "object_prefix=dev" >> "$GITHUB_OUTPUT"
          fi
        env:
          CAPROVER_DEVELOP_APP: ${{ vars.CAPROVER_APP || 'arcigy-kitchen-develop' }}
          CAPROVER_DEVELOP_APP_URL: ${{ vars.CAPROVER_APP_URL }}
          CAPROVER_PRODUCTION_APP: ${{ vars.CAPROVER_PRODUCTION_APP || 'kitchenapp' }}
          CAPROVER_PRODUCTION_APP_URL: ${{ vars.CAPROVER_PRODUCTION_APP_URL }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Needed for the archive manifest and preflight scripts. Typecheck, lint,
        # tests and build already passed in CI for this exact SHA.
        run: npm ci

      - name: Production dependency policy
        # Re-checked at deploy time so a newly published advisory still blocks.
        run: npm run security:dependencies

      - name: Create deploy archive
        run: |
          npx --no-install tsx scripts/listDeployMaterialAssets.ts > material-asset-files.txt

          tar \
            --exclude-vcs \
            --exclude=.env \
            --exclude=./node_modules \
            --exclude=./dist \
            --exclude=./reports \
            --exclude=./outputs \
            --exclude=./storage \
            --exclude='*.log' \
            --exclude=kitchenapp.tar \
            --exclude=material-asset-files.txt \
            --exclude=./assets/materials \
            --exclude=./backend/materials/assets \
            --exclude=./HDRI \
            --exclude=./Materials \
            --exclude=./blender/previews \
            --exclude=./public/hdri \
            --exclude=./public/materials \
            -cf kitchenapp.tar .

          tar -rf kitchenapp.tar -T material-asset-files.txt
          ls -lh kitchenapp.tar

      - name: Validate isolated and durable CapRover target
        run: |
          set -euo pipefail
          trap 'rm -f caprover-apps.json' EXIT
          if [ -z "${CAPROVER_APP_URL:-}" ]; then
            echo "CAPROVER_APP_URL is required for post-deploy health and readiness verification."
            exit 1
          fi
          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t /user/apps/appDefinitions \
            -m GET \
            -d '{}' \
            -o caprover-apps.json
          chmod 600 caprover-apps.json
          npx --no-install tsx scripts/validateCapRoverDeployPreflight.ts caprover-apps.json
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP: ${{ steps.caprover_app.outputs.app }}
          CAPROVER_APP_URL: ${{ steps.caprover_app.outputs.url }}
          ARCIGY_DEPLOY_APP_ENV: ${{ steps.caprover_app.outputs.app_env }}
          ARCIGY_DEPLOY_DATABASE_SCHEMA: ${{ steps.caprover_app.outputs.database_schema }}
          ARCIGY_DEPLOY_OBJECT_PREFIX: ${{ steps.caprover_app.outputs.object_prefix }}
          ARCIGY_DEPLOY_STORAGE_PATH: /app/storage

      - name: Inspect CapRover image capacity (read-only)
        run: |
          set -euo pipefail
          trap 'rm -f caprover-unused-images.json' EXIT
          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t /user/apps/appDefinitions/unusedImages \
            -m GET \
            -d '{"mostRecentLimit":2}' \
            -o caprover-unused-images.json
          chmod 600 caprover-unused-images.json
          npx --no-install tsx scripts/caproverUnusedImageCleanup.ts inspect caprover-unused-images.json
          echo "Automatic image deletion is disabled. Any cleanup requires a fresh reviewed inventory and explicit operational approval."
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}

      - name: Deploy
        id: deploy_caprover
        continue-on-error: true
        run: |
          set -o pipefail
          npx caprover@2.3.1 deploy -h "$CAPROVER_SERVER" -p "$CAPROVER_PASSWORD" -a "$CAPROVER_APP" -t kitchenapp.tar 2>&1 | tee deploy.log
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          CAPROVER_APP: ${{ steps.caprover_app.outputs.app }}

      - name: Verify deployed health and readiness
        id: readiness
        if: steps.deploy_caprover.outcome == 'success'
        run: |
          base_url="${CAPROVER_APP_URL%/}"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "$base_url/health" >/dev/null && \
               curl --fail --silent --show-error --max-time 10 "$base_url/ready" >/dev/null; then
              echo "Deployment is healthy and ready."
              exit 0
            fi
            sleep 5
          done
          echo "Deployment did not become healthy and ready in time."
          exit 1
        env:
          CAPROVER_APP_URL: ${{ steps.caprover_app.outputs.url }}

      - name: Notify deploy result
        if: always() && env.NTFY_TOPIC != ''
        run: |
          python - <<'PY' > payload.json
          import json, os
          payload = {
            "app": os.environ["APP_NAME"],
            "status": os.environ["DEPLOY_STATUS"],
            "commit": os.environ["DEPLOY_SHA"],
            "branch": os.environ["DEPLOY_BRANCH"],
            "repo": os.environ["GITHUB_REPOSITORY"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          print(json.dumps(payload))
          PY
          curl -fsS -X POST --data-binary @payload.json "https://ntfy.sh/$NTFY_TOPIC" || true
        env:
          APP_NAME: ${{ steps.caprover_app.outputs.app }}
          DEPLOY_STATUS: ${{ steps.deploy_caprover.outcome == 'success' && steps.readiness.outcome == 'success' && 'success' || 'failure' }}

      - name: Fail if deploy or readiness failed
        if: steps.deploy_caprover.outcome != 'success' || steps.readiness.outcome != 'success'
        run: exit 1
