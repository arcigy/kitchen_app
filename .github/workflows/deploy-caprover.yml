name: Deploy to CapRover

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: develop
        type: choice
        options:
          - develop
          - production
      confirmation:
        description: Type DEPLOY PRODUCTION for a production deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'develop' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.target == 'production' && 'production' || 'develop' }}
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DEPLOY_TARGET: ${{ inputs.target || 'develop' }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation || '' }}
      DEVELOP_CAPROVER_APP: ${{ vars.CAPROVER_APP || 'arcigy-kitchen-develop' }}
      DEVELOP_CAPROVER_APP_URL: ${{ vars.CAPROVER_APP_URL }}
      PRODUCTION_CAPROVER_APP: ${{ vars.CAPROVER_PRODUCTION_APP }}
      PRODUCTION_CAPROVER_APP_URL: ${{ vars.CAPROVER_PRODUCTION_APP_URL }}

    steps:
      - name: Validate deployment intent
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_TARGET" = "production" ]; then
            if [ "$DEPLOY_EVENT" != "workflow_dispatch" ] || [ "$DEPLOY_REF" != "refs/heads/main" ]; then
              echo "Production deployment is manual-only and must run from main."
              exit 1
            fi
            if [ "$DEPLOY_CONFIRMATION" != "DEPLOY PRODUCTION" ]; then
              echo "Production deployment confirmation is missing or incorrect."
              exit 1
            fi
            if [ -z "$PRODUCTION_CAPROVER_APP" ] || [ -z "$PRODUCTION_CAPROVER_APP_URL" ]; then
              echo "CAPROVER_PRODUCTION_APP and CAPROVER_PRODUCTION_APP_URL are required."
              exit 1
            fi
            selected_app="$PRODUCTION_CAPROVER_APP"
            selected_url="$PRODUCTION_CAPROVER_APP_URL"
            namespace="prod"
          elif [ "$DEPLOY_TARGET" = "develop" ]; then
            if [ -z "$DEVELOP_CAPROVER_APP" ] || [ -z "$DEVELOP_CAPROVER_APP_URL" ]; then
              echo "CAPROVER_APP and CAPROVER_APP_URL are required."
              exit 1
            fi
            selected_app="$DEVELOP_CAPROVER_APP"
            selected_url="$DEVELOP_CAPROVER_APP_URL"
            namespace="dev"
          else
            echo "Unknown deployment target."
            exit 1
          fi

          if [[ ! "$selected_app" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Selected CapRover application name is invalid."
            exit 1
          fi
          if [[ "$selected_url" == *$'\n'* || "$selected_url" == *$'\r'* ]]; then
            echo "Selected CapRover application URL is invalid."
            exit 1
          fi

          {
            echo "CAPROVER_APP=$selected_app"
            echo "CAPROVER_APP_URL=$selected_url"
            echo "ARCIGY_DEPLOY_APP_ENV=$namespace"
            echo "ARCIGY_DEPLOY_DATABASE_SCHEMA=$namespace"
            echo "ARCIGY_DEPLOY_OBJECT_PREFIX=$namespace"
            echo "ARCIGY_DEPLOY_STORAGE_PATH=/app/storage"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production dependency policy
        run: npm run security:dependencies

      - name: Build
        run: npm run build

      - name: Create deploy archive
        run: |
          node - <<'NODE' > material-basecolor-files.txt
          const fs = require("fs");
          const source = [
            fs.readFileSync("src/app/materialPbrOptions.ts", "utf8"),
            fs.readFileSync("server/workerServer.ts", "utf8")
          ].join("\n");
          const paths = [...new Set([...source.matchAll(/assets\/materials\/[^"'`]+?\/maps\/basecolor\.jpg/g)].map((match) => match[0]))];
          for (const filePath of paths) {
            if (fs.existsSync(filePath)) console.log(filePath);
          }
          NODE

          tar \
            --exclude-vcs \
            --exclude=.env \
            --exclude=./node_modules \
            --exclude=./dist \
            --exclude=./reports \
            --exclude=./outputs \
            --exclude=./storage \
            --exclude='*.log' \
            --exclude=kitchenapp.tar \
            --exclude=material-basecolor-files.txt \
            --exclude=./assets/materials \
            --exclude=./backend/materials/assets \
            --exclude=./HDRI \
            --exclude=./Materials \
            --exclude=./blender/previews \
            --exclude=./public/hdri \
            --exclude=./public/materials \
            -cf kitchenapp.tar .

          tar -rf kitchenapp.tar -T material-basecolor-files.txt
          ls -lh kitchenapp.tar

      - name: Validate isolated and durable CapRover target
        run: |
          set -euo pipefail
          trap 'rm -f caprover-apps.json' EXIT
          if [ -z "${CAPROVER_APP_URL:-}" ]; then
            echo "CAPROVER_APP_URL is required for post-deploy health and readiness verification."
            exit 1
          fi
          npx caprover@2.3.1 api \
            -u "$CAPROVER_SERVER" \
            -p "$CAPROVER_PASSWORD" \
            -t /user/apps/appDefinitions \
            -m GET \
            -d '{}' \
            -o caprover-apps.json
          chmod 600 caprover-apps.json
          npx --no-install tsx scripts/validateCapRoverDeployPreflight.ts caprover-apps.json
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}

      - name: Deploy
        id: deploy_caprover
        continue-on-error: true
        run: |
          set -o pipefail
          npx caprover@2.3.1 deploy -h "$CAPROVER_SERVER" -p "$CAPROVER_PASSWORD" -a "$CAPROVER_APP" -t kitchenapp.tar 2>&1 | tee deploy.log
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}

      - name: Verify deployed health and readiness
        id: readiness
        if: steps.deploy_caprover.outcome == 'success'
        run: |
          set -o pipefail
          base_url="${CAPROVER_APP_URL%/}"
          verify_endpoint() {
            curl --fail --silent --show-error --max-time 10 "$base_url/$1" | \
              npx --no-install tsx scripts/verifyReadinessResponse.ts "$1"
          }
          for attempt in $(seq 1 18); do
            if verify_endpoint health && verify_endpoint ready; then
              echo "Deployment is healthy and ready."
              exit 0
            fi
            sleep 5
          done
          echo "Deployment did not become healthy and ready in time."
          exit 1

      - name: Notify deploy result
        if: always() && env.NTFY_TOPIC != ''
        run: |
          python - <<'PY' > payload.json
          import json, os
          payload = {
            "app": os.environ.get("CAPROVER_APP", f"unselected-{os.environ['DEPLOY_TARGET']}"),
            "status": os.environ["DEPLOY_STATUS"],
            "commit": os.environ["GITHUB_SHA"],
            "branch": os.environ["GITHUB_REF_NAME"],
            "repo": os.environ["GITHUB_REPOSITORY"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          print(json.dumps(payload))
          PY
          curl -fsS -X POST --data-binary @payload.json "https://ntfy.sh/$NTFY_TOPIC" || true
        env:
          DEPLOY_STATUS: ${{ steps.deploy_caprover.outcome == 'success' && steps.readiness.outcome == 'success' && 'success' || 'failure' }}

      - name: Fail if deploy or readiness failed
        if: steps.deploy_caprover.outcome != 'success' || steps.readiness.outcome != 'success'
        run: exit 1
