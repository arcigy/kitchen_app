    <g id="wood-roll">
      <path d="M232 206 C248 180 286 171 336 178 L724 195 C770 198 791 218 780 249 C771 276 738 286 690 280 L300 260 C242 257 214 237 232 206 Z" fill="#19110c" opacity=".18"/>
      <rect x="216" y="164" width="552" height="93" rx="47" fill="url(#woodBody)" stroke="#382116" stroke-width="5"/>
      <ellipse cx="221" cy="211" rx="73" ry="47" fill="#755234" opacity=".78"/>
      <ellipse cx="762" cy="211" rx="48" ry="58" fill="url(#woodCap)" stroke="#321c13" stroke-width="5"/>
      <ellipse cx="764" cy="212" rx="27" ry="32" fill="#704222"/>
      <ellipse cx="777" cy="216" rx="19" ry="23" fill="url(#hole)"/>
      <ellipse cx="744" cy="197" rx="11" ry="8" fill="#bc8147" opacity=".58"/>

      <path d="M250 181 C370 180 526 189 726 202" fill="none" stroke="#ca8a4f" stroke-width="5" stroke-linecap="round" opacity=".34"/>
      <path d="M246 199 C395 200 545 207 727 221" fill="none" stroke="#60391f" stroke-width="5" stroke-linecap="round" opacity=".42"/>
      <path d="M279 221 C421 222 557 229 716 241" fill="none" stroke="#c78a4f" stroke-width="4" stroke-linecap="round" opacity=".3"/>
      <path d="M305 237 C426 238 546 243 696 252" fill="none" stroke="#4e2d1b" stroke-width="4" stroke-linecap="round" opacity=".35"/>
      <path d="M250 174 C375 174 529 183 724 195" fill="none" stroke="#e0a365" stroke-width="4" stroke-linecap="round" opacity=".22"/>

      <rect x="260" y="238" width="22" height="43" rx="11" fill="#17110e"/>
      <rect x="699" y="248" width="20" height="42" rx="10" fill="#17110e"/>
      <ellipse cx="271" cy="281" rx="13" ry="9" fill="#17110e"/>
      <ellipse cx="709" cy="290" rx="12" ry="8" fill="#17110e"/>
    </g>
  </g>
</svg>
