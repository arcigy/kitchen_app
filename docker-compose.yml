services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchen_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitchen_app
      POSTGRES_USER: kitchen_app
      POSTGRES_PASSWORD: kitchen_app
    ports:
      - "5432:5432"
    volumes:
      - kitchen_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen_app -d kitchen_app"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kitchen_app_postgres_data:
